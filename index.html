<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydraulic Gantry Crane & Track Load Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
    }
    input[type="range"] {
      accent-color: #2563eb;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; font-size: 12px; }
      .print-break { page-break-after: always; }
      .card-shadow { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- Top Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-blue-600 rounded-lg text-white font-black text-xl shadow">
        ⚡
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Gantry Crane & Track Load Analyzer
          <span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded border border-blue-700 font-mono">v3.0 Dual-Hook</span>
        </h1>
        <p class="text-xs text-slate-400">Structural Statics, Lifting Inventory & Longitudinal 45° Track Ground Stress</p>
      </div>
    </div>
    <div class="flex items-center gap-3 no-print">
      <button id="btnPrint" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded-lg border border-slate-600 transition flex items-center gap-2 shadow-sm">
        <span>🖨️</span> Print / PDF Report
      </button>
      <button id="btnReset" class="px-4 py-2 bg-rose-900/40 hover:bg-rose-800/60 text-rose-300 text-sm font-semibold rounded-lg border border-rose-700/50 transition">
        Reset Defaults
      </button>
    </div>
  </header>
